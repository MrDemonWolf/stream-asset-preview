<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/stream-asset-preview/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/stream-asset-preview/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/stream-asset-preview/favicon-192x192.png" />
    <link rel="apple-touch-icon" href="/stream-asset-preview/apple-touch-icon.png" />
    <meta name="theme-color" content="#0e0e10" />
    <!-- The app ships a single committed dark theme; tell the browser so native
         UI (form controls, scrollbars) paints dark instead of flashing light. -->
    <meta name="color-scheme" content="dark" />

    <!-- Primary SEO -->
    <title>Twitch & Discord Emote Maker & Cropper — Free Stream Asset Tool</title>
    <meta
      name="description"
      content="Free browser tool for streamers: crop and resize any image into Twitch emotes, sub badges, or Discord emoji and stickers with a drag-and-zoom editor that shows exactly what gets cut — then preview it in real chat and download every required size. Also sorts a whole emote set into slot-aware Twitch tiers and Discord boost levels to export one showcase image. No upload, no sign-up, 100% in your browser."
    />
    <link rel="canonical" href="https://mrdemonwolf.github.io/stream-asset-preview/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="MrDemonWolf, Inc." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stream Asset Previewer" />
    <meta property="og:title" content="Twitch & Discord Emote Showcase Maker for Streamers" />
    <meta
      property="og:description"
      content="Organize your Twitch tier and Discord boost-level emotes into a slot-aware grid, preview PNGs & GIFs, and export one advertising image. 100% in your browser — no upload, no sign-up."
    />
    <meta property="og:url" content="https://mrdemonwolf.github.io/stream-asset-preview/" />
    <meta property="og:image" content="https://mrdemonwolf.github.io/stream-asset-preview/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stream Asset Previewer" />

    <!-- Twitter / X (falls back to Open Graph for the rest) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Twitch & Discord Emote Showcase Maker for Streamers" />
    <meta
      name="twitter:description"
      content="Organize your Twitch tier and Discord boost-level emotes into a slot-aware grid, preview PNGs & GIFs, and export one advertising image. 100% in your browser — no upload, no sign-up."
    />
    <meta name="twitter:image" content="https://mrdemonwolf.github.io/stream-asset-preview/og.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Stream Asset Previewer",
        "url": "https://mrdemonwolf.github.io/stream-asset-preview/",
        "description": "Free tool for streamers to crop and resize any image into Twitch emotes, sub badges, and Discord emoji or stickers at every required size, preview them in real chat, and organize a whole emote set into a slot-aware showcase. Runs entirely in the browser.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "screenshot": "https://mrdemonwolf.github.io/stream-asset-preview/og.png",
        "featureList": [
          "Crop any image to a square Twitch emote, sub badge, Discord emoji, or sticker",
          "Drag-and-zoom crop editor that shows exactly what gets cut",
          "Exports every required size with per-file KB weight and spec warnings",
          "Live Twitch chat and Discord message previews",
          "Slot-aware showcase organizer for Twitch tiers and Discord boost levels",
          "Runs 100% client-side — no upload, no sign-up"
        ],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Organization", "name": "MrDemonWolf, Inc.", "url": "https://www.mrdemonwolf.com" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
